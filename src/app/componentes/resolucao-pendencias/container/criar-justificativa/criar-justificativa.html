<div class="justificativa-container">
  <h2>Criar Justificativa</h2>

  <!-- 1. Anexar imagem -->
  <div class="upload-imagem" (click)="inputImagem.click()">
    <mat-icon>image</mat-icon>

    <span>Anexar Imagem</span>

    <input #inputImagem type="file" accept="image/*" hidden />
  </div>

  <!-- 2. Texto -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Digite a justificativa</mat-label>

    <textarea
      matInput
      rows="6"
      placeholder="Escreva sua justificativa aqui..."
      [(ngModel)]="justificativa"
    ></textarea>
  </mat-form-field>

  <!-- 3. Enviar -->
  <button mat-flat-button color="primary" (click)="salvar()">Enviar</button>

  <!-- 4. Cancelar -->
  <button mat-stroked-button color="warn" (click)="cancelar()">Cancelar</button>
</div>
