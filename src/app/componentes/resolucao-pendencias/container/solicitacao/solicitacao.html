<br />

<section class="br-card detalhes-avaliacao">
  <!-- HEADER -->
  <div class="card-header">
    <h2 class="titulo-secao">Detalhes de avaliação</h2>

    <p class="descricao-pagina">
      Estes são os detalhes de avaliação de
      <strong>{{ relatorio.ocupante.nome }}</strong>
      com número do requerimento
      <strong>{{ relatorio.requerimento }}</strong
      >.
    </p>
  </div>

  <!-- CONTENT -->
  <div class="card-content">
    <div class="lista-pendencias">
      @for (pendencia of pendencias; track pendencia.titulo) {
        <section class="pendencia-item">
          <!-- TOPO -->
          <div class="topo-pendencia">
            <div class="info-pendencia">
              <span class="label-campo"> Pendência </span>

              <strong class="valor-campo">
                {{ pendencia.titulo }}
              </strong>

              <span class="categoria-pendencia">
                {{ pendencia.categoria }}
              </span>
            </div>

            <span
              class="status-badge"
              [ngClass]="getStatusClass(pendencia.status)"
            >
              {{ pendencia.status }}
            </span>
          </div>

          <!-- FORM -->
          <div class="formulario-pendencia">
            <!-- DESCRIÇÃO -->
            <div class="campo-formulario">
              <label class="label-campo"> Descrição </label>

              <textarea
                rows="4"
                class="campo-textarea campo-bloqueado"
                readonly
              >
Pendência identificada automaticamente pelo sistema durante a análise do requerimento.
              </textarea>
            </div>

            <!-- ESPECIFICAÇÃO -->
            <div class="campo-formulario">
              <label class="label-campo"> Especificação </label>

              <textarea
                rows="4"
                class="campo-textarea"
                placeholder="Informe detalhes técnicos ou complementares..."
                [(ngModel)]="pendencia.especificacao"
              ></textarea>
            </div>

            <!-- JUSTIFICATIVA -->
            <div class="campo-formulario">
              <label class="label-campo"> Justificativa </label>

              <textarea
                rows="5"
                class="campo-textarea"
                placeholder="Informe a justificativa para resolução da pendência..."
                [(ngModel)]="pendencia.justificativa"
              ></textarea>
            </div>

            <!-- AÇÕES -->
            <div class="acoes-card">
              <div class="acoes-card">
                <button
                  mat-stroked-button
                  type="button"
                  class="botao-cancelar"
                  (click)="cancelarPendencia(pendencia)"
                >
                  <mat-icon>close</mat-icon>

                  Cancelar
                </button>

                <button
                  mat-flat-button
                  type="button"
                  color="primary"
                  class="botao-salvar"
                  (click)="salvarResolucao(pendencia)"
                >
                  <mat-icon>save</mat-icon>

                  Salvar resolução
                </button>
              </div>
            </div>
          </div>
        </section>
      }
    </div>
  </div>
</section>
